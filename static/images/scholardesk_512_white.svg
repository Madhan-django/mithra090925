<?xml version="1.0" encoding="UTF-8"?>
<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <rect width="512" height="512" rx="80" fill="#ffffff"/>
  <rect width="512" height="512" rx="80" fill="none" stroke="#e8e4dc" stroke-width="2"/>
  <defs>
    <linearGradient id="arcG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f5a623"/>
      <stop offset="45%" style="stop-color:#4caf50"/>
      <stop offset="100%" style="stop-color:#2e7d32"/>
    </linearGradient>
    <linearGradient id="bkL" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1a3a6b"/>
      <stop offset="100%" style="stop-color:#2196f3"/>
    </linearGradient>
    <linearGradient id="lfG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#66bb6a"/>
      <stop offset="100%" style="stop-color:#2e7d32"/>
    </linearGradient>
  </defs>

  <!-- Arc sweep -->
  <path d="M 96 316 A 178 178 0 0 1 426 148" fill="none" stroke="url(#arcG)" stroke-width="22" stroke-linecap="round"/>

  <!-- Book left (navy-blue) -->
  <path d="M 256 368 C 220 342 154 322 82 334 C 92 296 102 258 112 220 C 170 205 232 222 256 256Z" fill="url(#bkL)"/>
  <!-- Book right (green) -->
  <path d="M 256 368 C 292 342 358 322 430 334 C 420 296 410 258 400 220 C 342 205 280 222 256 256Z" fill="url(#lfG)"/>

  <!-- Page detail lines left -->
  <path d="M 168 295 C 200 286 236 284 251 289" fill="none" stroke="rgba(255,255,255,0.45)" stroke-width="3" stroke-linecap="round"/>
  <path d="M 152 318 C 188 308 230 306 251 311" fill="none" stroke="rgba(255,255,255,0.45)" stroke-width="3" stroke-linecap="round"/>
  <!-- Page detail lines right -->
  <path d="M 344 295 C 312 286 276 284 261 289" fill="none" stroke="rgba(255,255,255,0.45)" stroke-width="3" stroke-linecap="round"/>

  <!-- Spine -->
  <ellipse cx="256" cy="367" rx="10" ry="7" fill="#1a3a6b"/>

  <!-- Person head -->
  <circle cx="256" cy="232" r="18" fill="#1a3a6b"/>

