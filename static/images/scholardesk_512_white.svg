  <!-- Cap top -->
  <rect x="238" y="124" width="36" height="26" rx="4" fill="#1a3a6b"/>
  <!-- Cap highlight -->
  <polygon points="256,156 352,188 256,206 160,188" fill="#243f7a" opacity="0.4"/>

  <!-- Tassel -->
  <line x1="372" y1="188" x2="392" y2="254" stroke="#1a3a6b" stroke-width="4" stroke-linecap="round"/>
  <line x1="392" y1="254" x2="384" y2="298" stroke="#1a3a6b" stroke-width="3"/>
  <line x1="392" y1="254" x2="392" y2="300" stroke="#1a3a6b" stroke-width="3"/>
  <line x1="392" y1="254" x2="400" y2="298" stroke="#1a3a6b" stroke-width="3"/>
  <circle cx="392" cy="254" r="6" fill="#1a3a6b"/>

