        letter-spacing="4">SCHOOL ERP SOFTWARE</text>
  <line x1="416" y1="458" x2="452" y2="458" stroke="#2e7d32" stroke-width="2"/>

  <!-- By Nexis -->
  <text x="256" y="494"
        font-family="Arial, sans-serif"
        font-size="13"
