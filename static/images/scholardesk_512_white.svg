  <rect x="400" y="112" width="26" height="26" rx="4" fill="#1a6e3c" opacity="0.9"/>
  <rect x="432" y="90"  width="20" height="20" rx="3" fill="#2196f3" opacity="0.85"/>
  <rect x="430" y="118" width="16" height="16" rx="3" fill="#1a6e3c" opacity="0.72"/>
  <rect x="456" y="102" width="14" height="14" rx="3" fill="#1a3a6b" opacity="0.65"/>
  <rect x="450" y="130" width="11" height="11" rx="2" fill="#2196f3" opacity="0.52"/>
  <rect x="474" y="92"  width="12" height="12" rx="2" fill="#1a6e3c" opacity="0.45"/>
  <rect x="472" y="120" width="9"  height="9"  rx="2" fill="#1a3a6b" opacity="0.38"/>
  <rect x="490" y="108" width="7"  height="7"  rx="2" fill="#2196f3" opacity="0.28"/>
  <rect x="464" y="146" width="7"  height="7"  rx="2" fill="#1a6e3c" opacity="0.25"/>
  <rect x="484" y="136" width="5"  height="5"  rx="1" fill="#1a3a6b" opacity="0.18"/>

  <!-- Wordmark -->
  <text x="256" y="432"
        font-family="Arial Black, Arial, sans-serif"
        font-size="72"
        font-weight="900"
        text-anchor="middle"
        letter-spacing="-1">
    <tspan fill="#1a3a6b">Scholar</tspan><tspan fill="#2e7d32">Desk</tspan>
  </text>

