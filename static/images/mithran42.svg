<svg width="68" height="68" viewBox="0 0 68 68" xmlns="http://www.w3.org/2000/svg">
  <!-- Container background -->
  <defs>
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:rgba(255,255,255,0.05);stop-opacity:1" />
      <stop offset="100%" style="stop-color:rgba(255,255,255,0.02);stop-opacity:1" />
    </linearGradient>
    <filter id="shadow">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4"/>
      <feOffset dx="0" dy="4" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.45"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background container -->
  <rect width="68" height="68" rx="15" fill="url(#bg-gradient)" filter="url(#shadow)"/>
  <rect width="68" height="68" rx="15" fill="none" stroke="rgba(79,70,229,0.3)" stroke-width="1"/>
  <rect width="68" height="68" rx="15" fill="none" stroke="rgba(79,70,229,0.08)" stroke-width="1"/>
  
  <!-- M Logo Mark (centered) -->
  <g transform="translate(13, 13)">
    <!-- Main M shape -->
    <path d="M4,32 L4,10 L21,24 L38,10 L38,32 L32,32 L32,18 L21,28 L10,18 L10,32 Z" 
          fill="#4f46e5" 
          opacity="0.95"/>
    
    <!-- Accent layer for depth -->
    <path d="M6,30 L6,12 L21,25 L36,12 L36,30" 
          fill="none" 
          stroke="#6366f1" 
          stroke-width="2" 
          stroke-linecap="round" 
          opacity="0.6"/>
    
    <!-- Inner detail -->
    <rect x="16" y="22" width="10" height="2" fill="#818cf8" rx="1" opacity="0.8"/>
    <circle cx="21" cy="16" r="2" fill="#818cf8" opacity="0.8"/>
  </g>
</svg>
