{% extends 'panel/index.html' %}
{% block content %}

<!-- ═══════════════════════════════
     PAGE HEADER
     ═══════════════════════════════ -->
<div class="pc-page-header">
  <div class="pc-page-header-left">
    <div class="pc-breadcrumb">
      <a href="{% url 'home_dashboard' %}">Dashboard</a>
      <span class="pc-breadcrumb-sep"><i class="ri-arrow-right-s-line"></i></span>
      <a href="{% url 'room_list' %}">Rooms</a>
      <span class="pc-breadcrumb-sep"><i class="ri-arrow-right-s-line"></i></span>
      <span>New Room</span>
    </div>
    <div class="pc-page-title">New Room</div>
    <div class="pc-page-sub">Add a new room and assign it to a floor</div>
  </div>
  <div class="pc-page-header-right">
    <a href="{% url 'room_list' %}" class="pc-btn pc-btn-outline">
      <i class="ri-arrow-left-line"></i> Back to Rooms
    </a>
  </div>
</div>

<!-- ═══════════════════════════════
     FORM CARD
     ═══════════════════════════════ -->
<div class="pc-card" style="max-width:640px;">

  <div class="pc-card-header">
    <div>
      <div class="pc-card-title">
        <i class="ri-door-open-line me-2" style="color:var(--accent);"></i>Room Details
      </div>
      <div class="pc-card-sub">Fill in the details to register a new room</div>
    </div>
    <span class="pc-badge pc-badge-primary pc-badge-no-dot">
      <i class="ri-add-line"></i>&nbsp; New Entry
    </span>
  </div>

  <div class="pc-card-body">
    <form method="post" enctype="multipart/form-data">
      {% csrf_token %}

      <div style="display:grid;grid-template-columns:1fr 1fr;gap:18px;">

        <!-- Room Number -->
        <div class="pc-form-group" style="margin-bottom:0;">
          <label for="id_room_number" class="pc-label">
            Room No <span class="req">*</span>
          </label>
          <input type="text"
                 name="room_number"
                 id="id_room_number"
                 class="pc-input"
                 maxlength="50"
                 placeholder="e.g. 101"
                 required>
        </div>

        <!-- Floor Select -->
        <div class="pc-form-group" style="margin-bottom:0;">
          <label for="id_floor" class="pc-label">
            Floor <span class="req">*</span>
          </label>
          <select name="floor" id="id_floor" class="pc-select" required>
            <option value="">— Select Floor —</option>
            {% for floor in floors %}
              <option value="{{ floor.id }}">{{ floor }}</option>
            {% endfor %}
          </select>
        </div>

      </div>

      <div class="pc-divider"></div>

      <div style="display:flex;gap:10px;flex-wrap:wrap;">
        <button type="submit" class="pc-btn pc-btn-primary">
          <i class="ri-save-line"></i> Save Room
        </button>
        <button type="reset" class="pc-btn pc-btn-outline">
          <i class="ri-refresh-line"></i> Clear
        </button>
        <a href="{% url 'room_list' %}" class="pc-btn pc-btn-danger">
          <i class="ri-close-line"></i> Cancel
        </a>
      </div>

    </form>
  </div>

</div>

{% endblock %}
