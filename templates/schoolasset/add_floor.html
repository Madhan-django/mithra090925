{% extends 'panel/index.html' %}
{% block content %}

<!-- ═══════════════════════════════
     PAGE HEADER
     ═══════════════════════════════ -->
<div class="pc-page-header">
  <div class="pc-page-header-left">
    <div class="pc-breadcrumb">
      <a href="{% url 'home_dashboard' %}">Dashboard</a>
      <span class="pc-breadcrumb-sep"><i class="ri-arrow-right-s-line"></i></span>
      <a href="{% url 'floor_list' %}">Floors</a>
      <span class="pc-breadcrumb-sep"><i class="ri-arrow-right-s-line"></i></span>
      <span>New Floor</span>
    </div>
    <div class="pc-page-title">New Floor</div>
    <div class="pc-page-sub">Add a new floor and assign it to a block</div>
  </div>
  <div class="pc-page-header-right">
    <a href="{% url 'floor_list' %}" class="pc-btn pc-btn-outline">
      <i class="ri-arrow-left-line"></i> Back to Floors
    </a>
  </div>
</div>

<!-- ═══════════════════════════════
     FORM CARD
     ═══════════════════════════════ -->
<div class="pc-card" style="max-width:640px;">

  <div class="pc-card-header">
    <div>
      <div class="pc-card-title">
        <i class="ri-stack-line me-2" style="color:var(--accent);"></i>Floor Details
      </div>
      <div class="pc-card-sub">Fill in the details to register a new floor</div>
    </div>
    <span class="pc-badge pc-badge-primary pc-badge-no-dot">
      <i class="ri-add-line"></i>&nbsp; New Entry
    </span>
  </div>

  <div class="pc-card-body">
    <form method="post" enctype="multipart/form-data">
      {% csrf_token %}

      <div style="display:grid;grid-template-columns:1fr 1fr;gap:18px;">

        <!-- Floor Name -->
        <div class="pc-form-group" style="margin-bottom:0;">
          <label for="id_name" class="pc-label">
            Floor Name <span class="req">*</span>
          </label>
          <input type="text"
                 name="name"
                 id="id_name"
                 class="pc-input"
                 maxlength="100"
                 placeholder="e.g. Ground Floor"
                 required>
        </div>

        <!-- Select Block -->
        <div class="pc-form-group" style="margin-bottom:0;">
          <label for="id_block" class="pc-label">
            Block <span class="req">*</span>
          </label>
          <select name="block" id="id_block" class="pc-select" required>
            <option value="">— Select Block —</option>
            {% for block in blk %}
              <option value="{{ block.id }}">{{ block.name }}</option>
            {% endfor %}
          </select>
        </div>

      </div>

      <div class="pc-divider"></div>

      <div style="display:flex;gap:10px;flex-wrap:wrap;">
        <button type="submit" class="pc-btn pc-btn-primary">
          <i class="ri-save-line"></i> Save Floor
        </button>
        <button type="reset" class="pc-btn pc-btn-outline">
          <i class="ri-refresh-line"></i> Reset
        </button>
        <a href="{% url 'floor_list' %}" class="pc-btn pc-btn-danger">
          <i class="ri-close-line"></i> Cancel
        </a>
      </div>

    </form>
  </div>

</div>

{% endblock %}
