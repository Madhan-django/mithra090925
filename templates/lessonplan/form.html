{% extends 'panel/index.html' %}
{% load static %}

{% block content %}
<div class="container-xxl flex-grow-1 container-p-y">

  <div class="d-flex align-items-center mb-4 gap-3">
    <a href="{% url 'lesson_plan_list' %}" class="btn btn-outline-secondary btn-sm">
      <i class="ri-arrow-left-line"></i>
    </a>
    <div>
      <h4 class="fw-bold mb-0">{{ title }}</h4>
      <small class="text-muted">{{ skool.name }}</small>
    </div>
  </div>

  <form method="post" id="lp-form">
    {% csrf_token %}

    <div class="card mb-4">
      <div class="card-header bg-dark text-white fw-semibold">Chapter Details</div>
      <div class="card-body">
        <div class="row g-3">

          <div class="col-md-4">
            <label class="form-label fw-semibold">Class <span class="text-danger">*</span></label>
            {{ form.cls }}
          </div>

          <div class="col-md-4">
            <label class="form-label fw-semibold">Section <span class="text-danger">*</span></label>
            {{ form.section }}
          </div>

          <div class="col-md-4">
            <label class="form-label fw-semibold">Subject <span class="text-danger">*</span></label>
            {{ form.subject }}
          </div>

          <div class="col-md-4">
            <label class="form-label fw-semibold">Teacher <span class="text-danger">*</span></label>
            {{ form.teacher }}
          </div>

          <div class="col-md-8">
            <label class="form-label fw-semibold">Chapter <span class="text-danger">*</span></label>
            {{ form.chapter }}
          </div>

        </div>
      </div>
    </div>

    <div class="d-flex gap-2">
      <button type="submit" class="btn btn-primary">
        <i class="ri-save-line me-1"></i> Save &amp; Add Topics
      </button>
      <a href="{% url 'lesson_plan_list' %}" class="btn btn-outline-secondary">Cancel</a>
      {% if plan %}
      <form method="post" action="{% url 'lesson_plan_delete' plan.pk %}" class="ms-auto"
            onsubmit="return confirm('Delete this chapter and all its topics?');">
        {% csrf_token %}
        <button type="submit" class="btn btn-outline-danger btn-sm">
          <i class="ri-delete-bin-line me-1"></i> Delete Chapter
        </button>
      </form>
      {% endif %}
    </div>

  </form>
</div>

<script>
const clsEl  = document.getElementById('id_cls');
const secEl  = document.getElementById('id_section');
const subjEl = document.getElementById('id_subject');

const initSec  = "{{ form.section.value|default:'' }}";
const initSubj = "{{ form.subject.value|default:'' }}";

function loadSections(clsId, selectVal) {
  if (!clsId) { secEl.innerHTML = '<option value="">---------</option>'; return; }
  fetch(`{% url 'lp_ajax_sections' %}?cls_id=${clsId}`)
    .then(r => r.json())
    .then(data => {
      secEl.innerHTML = '<option value="">---------</option>';
      data.forEach(s => {
        const opt = new Option(s.section_name, s.id);
        if (String(s.id) === String(selectVal)) opt.selected = true;
        secEl.add(opt);
      });
    });
}

function loadSubjects(clsId, selectVal) {
  if (!clsId) { subjEl.innerHTML = '<option value="">---------</option>'; return; }
  fetch(`{% url 'lp_ajax_subjects' %}?cls_id=${clsId}`)
    .then(r => r.json())
    .then(data => {
      subjEl.innerHTML = '<option value="">---------</option>';
      data.forEach(s => {
        const opt = new Option(s.subject_name, s.id);
        if (String(s.id) === String(selectVal)) opt.selected = true;
        subjEl.add(opt);
      });
    });
}

clsEl.addEventListener('change', function () {
  loadSections(this.value, '');
  loadSubjects(this.value, '');
});

const initCls = clsEl.value;
if (initCls) {
  loadSections(initCls, initSec);
  loadSubjects(initCls, initSubj);
} else {
  secEl.innerHTML  = '<option value="">— select class first —</option>';
  subjEl.innerHTML = '<option value="">— select class first —</option>';
}
</script>
{% endblock %}
