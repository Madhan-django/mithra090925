{% extends 'panel/index.html' %}
{% block content %}

<style>
/* ===== GLOBAL FONT ===== */
body, h1, h3, h4, h5, label, input, select, button {
    font-family: 'Roboto', sans-serif;
}

/* ===== CARD ===== */
.card {
    border-radius: 20px;
    box-shadow: 0 6px 18px rgba(0,0,0,0.12);
    overflow: hidden;
    border: none;
}

/* ===== TITLE BAR (Style A - FINAL FORMAT) ===== */
.card-title {
    background: linear-gradient(90deg, #005C97, #363795);
    padding: 12px;
    border-radius: 20px 20px 0 0;
}

.card-title h5 {
    margin: 0;
}

.card-title h5 span {
    padding: 6px 25px;
    font-size: 15px;
    font-weight: 600;
    border-radius: 8px;
}

/* ===== CARD BODY ===== */
.card-body {
    padding: 35px 40px;
}

/* ===== FORM ===== */
.form-group {
    margin-bottom: 22px;
}

label {
    font-weight: 600;
    margin-bottom: 8px;
    display: block;
}

input, select {
    width: 100%;
    height: 48px !important;
    padding: 8px 12px;
    font-size: 15px;
    border-radius: 10px;
    border: 1px solid #ced4da;
    transition: 0.3s;
}

input:focus, select:focus {
    border-color: #2a92ff;
    box-shadow: 0 0 0 0.15rem rgba(42,146,255,.25);
    outline: none;
}

/* ===== BUTTONS ===== */
.btn-primary {
    background: linear-gradient(90deg, #0053d6, #2a92ff);
    border: none;
    font-weight: 500;
    padding: 9px 30px;
    border-radius: 10px;
}

.btn-primary:hover {
    opacity: 0.9;
}

/* Slight Red Gradient Cancel */
.btn-danger {
    background: linear-gradient(90deg, #c82333, #ff6b6b);
    border: none;
    font-weight: 500;
    padding: 9px 30px;
    border-radius: 10px;
}

.btn-danger:hover {
    opacity: 0.9;
}

/* ===== BUTTON BAR ===== */
.button-bar {
    text-align: center;
    margin-top: 30px;
}
</style>


<div class="col-lg-12 grid-margin stretch-card">
    <div class="card">

        <!-- TITLE -->
        <div class="card-title text-center">
            <h5>
                <span class="badge bg-light text-dark">
                    New Designation
                </span>
            </h5>
        </div>

        <div class="card-body">
            <div class="container col-md-8">

                <form method="POST">
                    {% csrf_token %}

                    <div class="form-group">
                        <label>Designation Title</label>
                        {{ form.title }}
                    </div>

                    <div class="form-group">
                        <label>Department</label>
                        <select name="department" id="id_department" required>
                            <option value="">---------</option>
                            {% for dep in dept %}
                                <option value="{{ dep.id }}">{{ dep.name }}</option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="button-bar">
                        <button type="submit" class="btn btn-primary me-2">Submit</button>
                        <a href="{% url 'designation_list' %}" class="btn btn-danger">Cancel</a>
                    </div>

                </form>

            </div>
        </div>

    </div>
</div>

{% endblock %}
