{% extends 'panel/index.html' %}
{% load static %}
{% block content %}

<style>

/* ===== GLOBAL FONT ===== */
body, h1, h3, h4, h5, label, th, td, input, select, textarea, button {
    font-family: 'Roboto', sans-serif;
}

/* ===== CARD ===== */
.card {
    border-radius: 20px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.10);
    overflow: hidden;
}

/* ===== TITLE BAR (Style A) ===== */
.card-title {
    background: linear-gradient(90deg, #005C97, #363795);
    padding: 6px !important;
    border-radius: 20px 20px 0 0;
}

.card-title h5 {
    margin: 0;
    font-size: 17px;
    font-weight: 500;
}

.card-title span.badge {
    background: #f8f9fa;
    color: #000;
    font-size: 13px;
    padding: 4px 20px;
    border-radius: 6px;
}

/* ===== FORM STYLING ===== */
.form-control, select {
    border-radius: 10px !important;
    height: 45px;
}

textarea.form-control {
    height: auto;
}

/* ===== BUTTONS ===== */
.btn-primary {
    background: linear-gradient(90deg, #0053d6, #2a92ff);
    border: none;
    font-weight: 500;
    padding: 8px 25px;
}

.btn-warning {
    background: linear-gradient(90deg, #ffb347, #ffcc33);
    border: none;
    font-weight: 500;
    padding: 8px 25px;
}

/* ===== SCHOOL HEADER ===== */
.school-header {
    text-align: center;
    margin-bottom: 30px;
}

.school-header img {
    border-radius: 50%;
    margin-right: 10px;
}

</style>


<!-- ===== School Header ===== -->
<div class="school-header">
    <div class="d-flex justify-content-center align-items-center">
        <img src="https://mithran.co.in/media/{{ skool.logo }}"
             alt="School Logo" width="60" height="60">
        <h4 class="mb-0">{{ skool }}</h4>
    </div>
</div>


<div class="col-lg-12 grid-margin stretch-card">
    <div class="card">

        <!-- ===== Title ===== -->
        <div class="card-title text-center">
            <h5>
                <span class="badge bg-light text-dark">New Allowance</span>
            </h5>
        </div>

        <!-- ===== Body ===== -->
        <div class="card-body">

            <div class="container">
                <form method="POST">
                    {% csrf_token %}

                    <div class="row">
                        <div class="col-md-12">
                            {{ form.as_p }}
                        </div>
                    </div>

                    <div class="text-center mt-4">
                        <button type="submit" class="btn btn-primary me-2">
                            Submit
                        </button>

                        <button type="reset" class="btn btn-warning">
                            Reset
                        </button>
                    </div>

                </form>
            </div>

        </div>
    </div>
</div>

{% endblock %}
