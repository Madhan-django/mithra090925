{% load static %}

<!DOCTYPE html>
<html>
<head>
    <title>Attendance Register</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>

        body{
            font-family: Roboto;
            background:#f5f5f5;
        }

        .table-responsive{
            overflow-x:auto;
        }

        table{
            white-space: nowrap;
            font-size:14px;
        }

        th{
            text-align:center;
            vertical-align:middle;
        }

        td{
            text-align:center;
            vertical-align:middle;
            font-weight:600;
        }

        .staff-col{
            min-width:220px;
            text-align:left;
            position: sticky;
            left: 0;
            background: white;
            z-index: 2;
        }

        .thead-dark th{
            background:#212529;
            color:white;
        }

        .p{
            background:#d1e7dd;
        }

        .a{
            background:#f8d7da;
        }

        .hd{
            background:#fff3cd;
        }

        .cl,.ml,.per,.lop{
            background:#cff4fc;
        }

        .h{
            background:#e2e3e5;
        }

    </style>
</head>
<body>

<div class="container-fluid mt-4">

    <div class="card shadow">

        <div class="card-header text-white"
             style="background: linear-gradient(to right, #0d6efd, #0b5ed7);">

            <div class="card-title text-center">
                <h5>
                    <span class="badge bg-light text-dark">
                        Attendance Register - {{ month }}/{{ year }}
                    </span>
                </h5>
            </div>

        </div>

        <div class="card-body">

            <div class="table-responsive">

                <table class="table table-bordered table-sm">

                    <thead class="thead-dark">

                    <tr>

                        <th class="staff-col">Staff Name</th>

                        {% for day in days %}
                            <th>{{ day }}</th>
                        {% endfor %}

                    </tr>

                    </thead>

                    <tbody>

                    {% for row in staff_attendance %}

                        <tr>

                            <td class="staff-col">
                                {{ row.staff }}
                            </td>

                            {% for status in row.days %}

                                <td class="
                                    {% if status == 'P' %}p
                                    {% elif status == 'A' %}a
                                    {% elif status == 'HD' %}hd
                                    {% elif status == 'CL' or status == 'ML' or status == 'PER' or status == 'LOP' %}cl
                                    {% elif status == 'H' %}h
                                    {% endif %}
                                ">
                                    {{ status }}
                                </td>

                            {% endfor %}

                        </tr>

                    {% endfor %}

                    </tbody>

                </table>

            </div>

        </div>

    </div>

</div>

</body>
</html>
