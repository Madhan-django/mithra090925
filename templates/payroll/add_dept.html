{% extends 'panel/index.html' %}
{% block content %}

<style>
/* ===== GLOBAL FONT ===== */
body, h1, h3, h4, h5, label, input, textarea, select, button {
    font-family: 'Roboto', sans-serif;
}

/* ===== CARD ===== */
.card {
    border-radius: 20px;
    box-shadow: 0 6px 18px rgba(0,0,0,0.12);
    overflow: hidden;
    border: none;
}

/* ===== TITLE BAR (Style A) ===== */
.card-title {
    background: linear-gradient(90deg, #005C97, #363795);
    padding: 12px;
    border-radius: 20px 20px 0 0;
    text-align: center;
}

.card-title h5 {
    margin: 0;
}

.card-title h5 span {
    background: #f8f9fa;
    color: #000;
    padding: 6px 25px;
    border-radius: 8px;
    font-size: 15px;
    font-weight: 600;
}

/* ===== CARD BODY ===== */
.card-body {
    padding: 35px 40px;
}

/* ===== FORM ===== */
form p {
    margin-bottom: 20px;
}

label {
    font-weight: 600;
    margin-bottom: 8px;
    display: block;
}

/* Inputs */
input, textarea, select {
    width: 100%;
    height: 48px;
    padding: 8px 12px;
    font-size: 15px;
    border-radius: 10px;
    border: 1px solid #ced4da;
    transition: 0.3s;
}

textarea {
    height: auto;
    min-height: 100px;
}

input:focus, textarea:focus, select:focus {
    border-color: #2a92ff;
    box-shadow: 0 0 0 0.15rem rgba(42,146,255,.25);
    outline: none;
}

/* ===== BUTTONS ===== */
.btn-primary {
    background: linear-gradient(90deg, #0053d6, #2a92ff);
    border: none;
    font-weight: 500;
    padding: 9px 28px;
    border-radius: 10px;
}

.btn-primary:hover {
    opacity: 0.9;
}

/* Slight Red Gradient Cancel */
.btn-danger {
    background: linear-gradient(90deg, #c82333, #ff6b6b);
    border: none;
    font-weight: 500;
    padding: 9px 28px;
    border-radius: 10px;
}

.btn-danger:hover {
    opacity: 0.9;
}

/* ===== BUTTON BAR ===== */
.button-bar {
    text-align: center;
    margin-top: 30px;
}
</style>


<div class="col-lg-12 grid-margin stretch-card">
    <div class="card">

        <!-- TITLE -->
        <div class="card-title text-center">
            <h5>
                <span class="badge bg-light text-dark">
                    New Department
                </span>
            </h5>
        </div>

        <div class="card-body">
            <form method="POST">
                {% csrf_token %}

                {{ form.as_p }}

                <div class="button-bar">
                    <button type="submit" class="btn btn-primary me-2">Submit</button>
                    <a href="{% url 'department_list' %}" class="btn btn-danger">Cancel</a>
                </div>
            </form>
        </div>

    </div>
</div>

{% endblock %}
