{% extends 'panel/index.html' %}
{% block content %}

<div class="col-lg-8">

  <div class="pc-page-header mb-3">
    <div class="pc-page-header-left">
      <nav class="pc-breadcrumb">
        <a href="{% url 'home_dashboard' %}">Dashboard</a>
        <span class="pc-breadcrumb-sep">›</span>
        <a href="{% url 'paper_list' %}">Papers</a>
        <span class="pc-breadcrumb-sep">›</span>
        <span>New Paper</span>
      </nav>
      <h1 class="pc-page-title">Create Question Paper</h1>
    </div>
  </div>

  <div class="pc-card">
    <div class="pc-card-header"><p class="pc-card-title">Paper Details</p></div>
    <div class="pc-card-body">
      <form method="POST">
        {% csrf_token %}

        <div class="nb-form-grid" style="--cols:2;">
          <div class="nb-field" style="grid-column:1/-1;">
            <label class="nb-label">Paper Title <span style="color:var(--danger)">*</span></label>
            <input type="text" class="nb-input" name="title" required placeholder="e.g. Half-Yearly Examination Paper">
          </div>
          <div class="nb-field">
            <label class="nb-label">Class <span style="color:var(--danger)">*</span></label>
            <select class="nb-select" name="cls" id="cls_sel" required>
              <option value="">— Select Class —</option>
              {% for c in classes %}
              <option value="{{ c.id }}">{{ c.name }}</option>
              {% endfor %}
            </select>
          </div>
          <div class="nb-field">
            <label class="nb-label">Subject <span style="color:var(--danger)">*</span></label>
            <select class="nb-select" name="subject" id="subj_sel" required>
              <option value="">— Select Subject —</option>
            </select>
          </div>
          <div class="nb-field">
            <label class="nb-label">Exam Name</label>
            <input type="text" class="nb-input" name="exam_name" placeholder="e.g. Half-Yearly 2024">
          </div>
          <div class="nb-field">
            <label class="nb-label">Set Label</label>
            <select class="nb-select" name="set_label">
              <option value="A">Set A</option>
              <option value="B">Set B</option>
              <option value="C">Set C</option>
              <option value="D">Set D</option>
            </select>
          </div>
          <div class="nb-field">
            <label class="nb-label">Total Marks</label>
            <input type="number" class="nb-input" name="total_marks" min="1" required value="100">
          </div>
          <div class="nb-field">
            <label class="nb-label">Duration (minutes)</label>
            <input type="number" class="nb-input" name="duration_mins" value="180" min="1">
          </div>
          <div class="nb-field" style="grid-column:1/-1;">
            <label class="nb-label">Blueprint (optional)</label>
            <select class="nb-select" name="blueprint">
              <option value="">— No Blueprint —</option>
              {% for bp in blueprints %}
              <option value="{{ bp.pk }}" {% if request.GET.bp == bp.pk|stringformat:'s' %}selected{% endif %}>
                {{ bp.name }} ({{ bp.cls.name }} / {{ bp.subject.subject_name }})
              </option>
              {% endfor %}
            </select>
            <p style="font-size:11px;color:var(--text-sm);margin-top:4px;">
              Selecting a blueprint will pre-create sections in the paper builder.
            </p>
          </div>
          <div class="nb-field" style="grid-column:1/-1;">
            <label class="nb-label">Instructions</label>
            <textarea class="nb-textarea" name="instructions" rows="3"
              placeholder="1. All questions are compulsory.&#10;2. Write clearly…"></textarea>
          </div>
        </div>

        <div style="display:flex;gap:10px;margin-top:16px;">
          <button type="submit" class="pc-btn pc-btn-primary" style="flex:1;justify-content:center;padding:11px;">
            <i class="ri-arrow-right-line"></i> Create &amp; Open Builder
          </button>
          <a href="{% url 'paper_list' %}" class="pc-btn pc-btn-outline" style="flex:1;justify-content:center;padding:11px;">
            Cancel
          </a>
        </div>

      </form>
    </div>
  </div>
</div>

<script>
document.getElementById('cls_sel').addEventListener('change', function() {
  fetch(`{% url 'qbank_ajax_subjects' %}?class_id=${this.value}`)
    .then(r => r.json())
    .then(data => {
      const sel = document.getElementById('subj_sel');
      sel.innerHTML = '<option value="">— Select Subject —</option>';
      data.subjects.forEach(s => sel.innerHTML += `<option value="${s.id}">${s.subject_name}</option>`);
    });
});
</script>

{% endblock %}
